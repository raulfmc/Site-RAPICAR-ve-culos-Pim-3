<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>AUTO LOCADORA RAPICAR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pim3.css">
    <script src="pim3.js" defer></script>
</head>
<body>
    <header>
        <div><h1 class="texto">RAPICAR VEICULOS</h1></div>
    </header>

    <main class="grid-container">
        <aside class="tabelaCadastro">
            <div class="campoDeEscrita"><h2 class="texto">Aluguel</h2></div>
            <div class="campoDeEscrita"><h4 class="texto">Cliente</h4></div>
            <div id="container-selecao-cliente">
                <button class="botao" id="btn-abrir-lista">Escolher cliente</button>
            </div>
            <br>
        </aside>
        <section class="tabela-carros">
            <table>
                <tr><td></td></tr>
            </table>
        </section>
    </main>

    <!-- Seção da Tabela de Clientes -->
    <section id="secao-clientes" style="display: none; padding: 20px;">
        <h2 class="texto">Selecione o Cliente</h2>
        <input type="text" id="input-busca-cliente" placeholder="Pesquisar por nome ou ID..." 
               style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: sans-serif;">
        <table class="tabela-carros" style="width: 100%; cursor: pointer;">
            <thead>
                <tr class="texto">
                    <th>ID / Nome</th>
                    <th>Documento</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-clientes">
                <!-- O JavaScript vai preencher aqui com os dados do banco -->
            </tbody>
        </table>
    </section>
    <br>

    <footer>
        <div class="container_botões">

            <div><button class="botao2">consultar tabela cliente</button></div>

            <div><button class="botao2">cadastrar novo cliente</button></div>

            <div><button class="botao2">Cadastra novo Carro</button></div>
        </div>
    </footer>
</body>
</html>
