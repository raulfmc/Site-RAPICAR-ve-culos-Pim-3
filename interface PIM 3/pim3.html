<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>AUTO LOCADORA RAPICAR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="pim3.css">
    <script src="pim3.js" defer></script>
</head>

<body>
    <header>
        <div>
            <h1 class="texto">RAPICAR VEICULOS</h1>
        </div>
    </header>

    <main class="grid-container">
        <aside class="tabelaCadastro">
            <div class="campoDeEscrita">
                <h2 class="texto">Aluguel</h2>
            </div>
            <div class="campoDeEscrita">
                <h4 class="texto">Cliente</h4>
            </div>
            <div id="container-selecao-cliente">
                <button class="botao" id="btn-abrir-lista">Escolher cliente</button>
            </div>

            <div class="campoDeEscrita">
                <h4 class="texto">Veículo</h4>
            </div>
            <div id="container-selecao-carro">
                <button  class="botao" id="btn-abrir-lista-carros">Escolher veículo</button>
            </div>
            <div>


                <div class="campoDeEscrita" style="gap:8px; margin-top: 10px;">

                    <h4 class="texto" style="font-size: 0.9rem;">Primeiro dia do aluguel</h4>
                    <input type="date" id="primeiro-dia-aluguel" style="width: 100%; padding: 10px; border-radius: 12px; border: 2px solid rgba(66, 128, 210, 0.5); font-family: 'Poppins', sans-serif;" required />

                    <h4 class="texto" style="font-size: 0.9rem;">Último dia do aluguel</h4>
                    <input type="date" id="ultimo-dia-aluguel" style="width: 100%; padding: 10px; border-radius: 12px; border: 2px solid rgba(66, 128, 210, 0.5); font-family: 'Poppins', sans-serif;" required />
                </div>
                <div class="campoDeEscrita" style="gap:8px; margin-top: 10px;">
                    <h4 class="texto" style="font-size: 0.9rem;">Valor total do aluguel</h4>
                    <div id="resumo-valor-total" class="texto" style="color: aliceblue; font-size: 1.1rem; font-weight: 600; text-shadow:none;">Valor total: R$ 0,00</div>
                </div>

                <button class="botao" id="btn-cotar">cotar</button>
            </div>

        </aside>

        <section class="tabela-carros">
            <table id="tabela-veiculos">
                <thead>
                    <tr class="texto">
                        <th>ID</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Cor</th>
                        <th>Placa</th>
                        <th>Valor R$</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-carros">
                </tbody>
            </table>
        </section>
    </main>

    <section id="secao-clientes" style="display: none; padding: 20px;">
        <h2 class="texto">Selecione o Cliente</h2>
        <input type="text" id="input-busca-cliente" placeholder="Pesquisar por nome ou ID..."
            style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: sans-serif;">
        <table class="tabela-carros" style="width: 100%; cursor: pointer;">
            <thead>
                <tr class="texto">
                    <th>ID / Nome</th>
                    <th>Documento</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-clientes">
            </tbody>
        </table>
    </section>
    <section id="secao-carros" style="display: none; padding: 20px;">
        <h2 class="texto">Selecione o Veículo</h2>
        <input type="text" id="input-busca-carro" placeholder="Pesquisar por modelo ou placa..."
            style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: sans-serif;">
        <table class="tabela-carros" style="width: 100%; cursor: pointer;">
            <thead>
                <tr class="texto">
                    <th>Marca/Modelo</th>
                    <th>Cor</th>
                    <th>Placa</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-selecao-carros">
            </tbody>
        </table>
    </section>
    <br>

    <footer>
        <div class="container_botões">

            <button class="botao2" onclick="window.location.href='tabelaCliente.html'">
                Tabela de Clientes
            </button>

            <button class="botao2" onclick="window.location.href='CadastroCliente.html'">
                Cadastrar novo Cliente
            </button>

            <button class="botao2" onclick="window.location.href='CadastroDeCarro.html'">
                Cadastrar novo Carro
            </button>

            <button class="botao2" onclick="window.location.href='cadastroFuncionario.html'">
                Cadastro de Funcionario
            </button>

            <div></div>
        </div>
    </footer>
    <script></script>
</body>

</html>
