<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>AUTO LOCADORA RAPICAR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="TabelaCarros.css">
    <script src="TabelaCarros.js" defer></script>

</head>
<body>
    <header>
        <div class="titulo"><h1> BEM VINDO A RAPICAR VEICULOS </h1></div>
    </header>
    <div></div>
    <section class="tabela-container">
        <h2 class="texto">Tabela de carros</h2>
        <input type="text" id="input-busca-carro" placeholder="Pesquisar por marca, modelo, placa ou ID...">
        
        <table class="tabela">
            <thead>
                <tr class="texto">
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano fabricação</th>
                    <th>Número</th>
                    <th>Versão</th>
                    <th>Câmbio</th>
                    <th>Placa</th>
                    <th>Cor</th>
                    <th>Qtd Aluguéis</th>
                    <th>Valor diária</th>
                    <th>Status</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-carros">

                
            </tbody>
        </table>
    </section>
    
    <footer>
        <div class="container_botoes">
            <button class="botao" onclick="window.location.href='pim3.html'">Voltar ao Início</button>
        </div>
    </footer>
</body>
</html>
