<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>AUTO LOCADORA RAPICAR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="cadastroDeCarro.css">
</head>

<body>
    <header>
        <div class="titulo">
            <h1> BEM VINDO A RAPICAR VEICULOS </h1>
        </div>
    </header>

    <br>
    <br>
    <br>

    <section class="login">
        <div class="texto">
            <h2>Cadastro de Carro</h2>
        </div>

        <div class="texto">Marca</div>
        <div class="campoDeEscrita"><input type="text" name="marca" id=Carro_Marca class="campoDeEscrita"></div>
        <br>

        <div class="texto">Modelo</div>
        <div class="campoDeEscrita"><input type="text" name="modelo" id=Carro_Modelo class="campoDeEscrita"></div>
        <br>

        <div class="texto">Ano de fabricação</div>
        <div class="campoDeEscrita"><input type="text" name="ano de fabricação" id=Carro_Ano_Fabricação
                class="campoDeEscrita"></div>
        <br>

        <div class="texto">Número do chassi</div>
        <div class="campoDeEscrita"><input type="text" name="número" id=Carro_Número class="campoDeEscrita"></div>
        <br>

        <div class="texto">Versão</div>
        <div class="campoDeEscrita"><input type="text" name="versão" id=Carro_Versão class="campoDeEscrita"></div>
        <br>

        <div class="texto">Câmbio</div>
        <div class="campoDeEscrita"><input type="text" name="câmbio" id=Carro_Câmbio class="campoDeEscrita"></div>
        <br>

        <div class="texto">Placa</div>
        <div class="campoDeEscrita"><input type="text" name="placa" id=Carro_Placa class="campoDeEscrita"></div>
        <br>

        <div class="texto">Cor</div>
        <div class="campoDeEscrita"><input type="text" name="cor" id=Carro_Cor class="campoDeEscrita"></div>
        <br>

        <div class="texto">Valor da diária</div>
        <div class="campoDeEscrita"><input type="text" name="ValorDaDiaria" id=Carro_Valor_Diária
                class="campoDeEscrita"></div>
        <br>
        <br>
        <div><button class="botao" type="button" onclick=criarCarro()>Cadastrar</button></div>
        <script src="cadastroDeCarro.js"></script>
    </section>

    <div id="error-modal" class="modal-erro">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Erro de Validação</h3>
            <p>Preencha todos os campos obrigatórios!</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const btnSubmit = document.querySelector('.botao[type="submit"]');
            const inputs = document.querySelectorAll('.campoDeEscrita input');
            const modal = document.getElementById('error-modal');
            const closeBtn = document.querySelector('.close');

            if (btnSubmit) {
                btnSubmit.addEventListener('click', function (e) {
                    e.preventDefault();

                    let hasEmpty = false;
                    inputs.forEach(input => {
                        if (!input.value.trim()) {
                            hasEmpty = true;
                            input.style.borderColor = 'rgb(255, 100, 100)';
                            input.style.boxShadow = '0 0 0 3px rgba(255, 100, 100, 0.3)';
                        } else {
                            input.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                            input.style.boxShadow = 'none';
                        }
                    });

                    if (hasEmpty) {
                        modal.style.display = 'flex';
                        document.body.style.overflow = 'hidden';
                    } else {
                        alert('Cadastro realizado com sucesso!');
                        window.location.href = "pim3.html";
                    }
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', function () {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                });
            }

            window.addEventListener('click', function (e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });
        });
    </script>
</body>

</html>
